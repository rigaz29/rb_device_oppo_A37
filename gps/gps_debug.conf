# Server PSDS untuk A37.
#
# Dibaca oleh GnssConfiguration.reloadGpsProperties() lewat
# loadPropertiesFromGpsDebugConfig(DEBUG_PROPERTIES_VENDOR_FILE), tanpa syarat
# build type -- "debug" hanya nama warisan berkasnya.
#
# KENAPA BUKAN gps.conf
#
# gps.conf punya XTRA_SERVER_1/2/3 yang dikomentari, dan itu memang harus tetap
# dikomentari: berkas tersebut dibaca BLOB VENDOR, bukan framework. Kode GNSS
# Android 16 nol menyebut XTRA_SERVER (diperiksa di seluruh
# services/core/java/com/android/server/location/gnss). Yang dibacanya adalah
# LONGTERM_PSDS_SERVER_1/2/3 (GnssConfiguration.java:84-86), dan sumbernya cuma
# dua: string-array config_gnssParameters -- kosong di AOSP
# (core/res/res/values/config.xml:7132) -- lalu berkas ini.
#
# Tanpa entri di bawah, framework mencatat tiap kali PSDS diminta:
#   E GnssPsdsDownloader: No Long-Term PSDS servers were specified in the
#                         GnssConfiguration
# Terukur di perangkat 28 Agu 2026. Akibatnya tidak ada unduhan data orbit
# prediktif, sehingga cold start harus mengurai almanak dari sinyal satelit
# langsung -- jauh lebih lama.
#
# RANTAINYA SAH SAMPAI KE BLOB @1.0
#
# Framework mengunduh lalu memanggil injectPsdsData, dan untuk HIDL 1.0 itu
# dipetakan ke IGnssXtra::injectXtraData (GnssPsds.cpp:65-69, dengan
# IGnssPsdsHidl = gnss::V1_0::IGnssXtra pada baris 27). HAL A37 menyediakan
# IGnssXtra lewat getExtensionXtra() (gnss/1.0/IGnss.hal:232).
#
# URL-nya diambil dari baris XTRA_SERVER yang sudah ada di gps.conf perangkat
# ini (format xtra2.bin, sesuai generasi msm8916), bukan dikarang. Ketiga host
# diverifikasi masih menjawab ping dari perangkat pada 28 Agu 2026.
LONGTERM_PSDS_SERVER_1=http://xtrapath1.izatcloud.net/xtra2.bin
LONGTERM_PSDS_SERVER_2=http://xtrapath2.izatcloud.net/xtra2.bin
LONGTERM_PSDS_SERVER_3=http://xtrapath3.izatcloud.net/xtra2.bin
